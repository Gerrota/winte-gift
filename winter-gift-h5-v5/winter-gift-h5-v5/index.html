<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#080d18" />
  <meta name="description" content="冬将至，我与你。一个关于冬日、雪花与祝福的互动 H5。" />
  <title>冬将至，我与你</title>
  <style>
    :root {
      --night: #080d18;
      --ice: #dce8f8;
      --muted: #aab8d0;
      --gold: #f2a13b;
      --purple: #4b365e;
      --blue: #2c91d8;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; width: 100%; min-height: 100%; background: var(--night); }
    body {
      color: #f5f8ff;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
                   "Microsoft YaHei", sans-serif;
      overflow: hidden;
      overscroll-behavior: none;
    }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    #app {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100svh;
      min-height: 560px;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(ellipse at 50% 48%, rgba(35, 49, 75, .74) 0%, rgba(15, 23, 39, .88) 48%, rgba(5, 8, 15, 1) 100%),
        #080d18;
    }
    #stars {
      position: absolute; inset: 0; width: 100%; height: 100%;
      z-index: 0; pointer-events: none;
    }
    #frostGrowth {
      position: absolute; inset: 0; width: 100%; height: 100%;
      z-index: 4; pointer-events: none; opacity: .96;
      mix-blend-mode: screen;
    }
    #snowfall {
      position: absolute; inset: 0; width: 100%; height: 100%;
      z-index: 6; pointer-events: none; opacity: .88;
      mix-blend-mode: screen;
    }
    .ambient-glow {
      position: absolute; inset: -15%;
      z-index: -2; pointer-events: none;
      background:
        radial-gradient(ellipse at 52% 48%, rgba(85, 112, 157, .19), transparent 43%),
        radial-gradient(ellipse at 15% 18%, rgba(79, 100, 139, .10), transparent 32%);
      animation: breathe 8s ease-in-out infinite alternate;
    }
    @keyframes breathe { from { transform: scale(.96); opacity: .6; } to { transform: scale(1.06); opacity: 1; } }

    .top-tools {
      position: absolute; top: max(22px, env(safe-area-inset-top)); left: 0; right: 0;
      z-index: 8; display: flex; align-items: center; justify-content: space-between;
      padding: 0 27px; pointer-events: none;
    }
    .trial {
      pointer-events: auto; border: 1.5px solid rgba(232, 148, 47, .82);
      color: #ffad45; background: rgba(10, 18, 32, .72);
      border-radius: 999px; padding: 11px 22px 10px;
      font-size: 17px; font-weight: 750; letter-spacing: 1px;
      box-shadow: 0 0 20px rgba(238, 148, 48, .06), inset 0 0 14px rgba(255,255,255,.025);
      backdrop-filter: blur(8px);
    }
    .music {
      pointer-events: auto; width: 54px; height: 54px; border-radius: 50%;
      border: 2px solid rgba(231, 239, 250, .68); color: #f4f8ff;
      background: rgba(9, 15, 27, .38); display: grid; place-items: center;
      font-size: 27px; line-height: 1; backdrop-filter: blur(8px);
      box-shadow: 0 0 18px rgba(211, 230, 255, .12);
      transition: transform .25s ease, background .25s ease;
    }
    .music:active { transform: scale(.92); }
    .music.playing { background: rgba(177, 207, 244, .2); animation: musicPulse 1.5s ease-in-out infinite; }
    @keyframes musicPulse { 50% { box-shadow: 0 0 26px rgba(207, 228, 255, .5); } }

    .intro-content {
      position: absolute; z-index: 2; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 0 24px;
      transform: translateY(-1.5%);
      transition: opacity .7s ease, transform .9s cubic-bezier(.2,.8,.2,1);
    }
    .snow-orbit {
      width: min(34vw, 276px); height: min(34vw, 276px); min-width: 190px; min-height: 190px;
      border: 2px solid rgba(160, 185, 222, .20); border-radius: 50%;
      display: grid; place-items: center; position: relative;
      box-shadow: 0 0 46px rgba(163, 195, 242, .035), inset 0 0 34px rgba(150, 180, 225, .025);
      animation: orbitFloat 5s ease-in-out infinite;
    }
    .snow-orbit::before {
      content: ""; position: absolute; inset: 10%; border-radius: 50%;
      background: radial-gradient(circle, rgba(201, 222, 255, .10), transparent 68%);
      filter: blur(10px);
    }
    @keyframes orbitFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .snowflake-button {
      border: 0; background: transparent; color: #eaf4ff; padding: 18px;
      display: grid; place-items: center; position: relative; z-index: 1;
      filter: drop-shadow(0 0 13px rgba(209, 231, 255, .6));
      transition: transform .45s ease, filter .45s ease;
    }
    .snowflake-button:active { transform: scale(.88) rotate(15deg); }

    /* 点击时：雪花向中心聚拢，核心蓄光，再炸开成冰晶 */
    .snow-orbit { transition: border-color .35s ease, box-shadow .35s ease; }
    .gathering .snow-orbit {
      border-color: rgba(221, 239, 255, .72);
      box-shadow: 0 0 48px rgba(194, 224, 255, .32), inset 0 0 38px rgba(194, 224, 255, .20);
      animation: orbitCharge .65s ease-in forwards;
    }
    .gathering .snowflake-button {
      animation: snowflakeCharge .65s cubic-bezier(.2,.75,.2,1) forwards;
    }
    .bursting .snow-orbit { animation: orbitBurst .58s ease-out forwards; }
    .bursting .snowflake-button { animation: snowflakeBurst .58s ease-out forwards; }
    .intro-content::after {
      content: ""; position: absolute; z-index: 4; left: 50%; top: 50%;
      width: min(118vmax, 1200px); aspect-ratio: 1; border-radius: 50%;
      pointer-events: none; opacity: 0;
      background: repeating-conic-gradient(
        from 0deg,
        rgba(239,248,255,.88) 0deg 1deg,
        transparent 1deg 13deg,
        rgba(176,213,250,.48) 13deg 14deg,
        transparent 14deg 22deg
      );
      -webkit-mask: radial-gradient(circle, transparent 0 8%, #000 15% 27%, transparent 63%);
      mask: radial-gradient(circle, transparent 0 8%, #000 15% 27%, transparent 63%);
      transform: translate(-50%,-50%) scale(.08) rotate(0deg);
      filter: drop-shadow(0 0 12px rgba(211,234,255,.75));
    }
    .bursting .intro-content::after {
      animation: iceShardBurst .82s cubic-bezier(.12,.68,.18,1) forwards;
    }
    @keyframes orbitCharge {
      0% { transform: scale(1); }
      100% { transform: scale(.88); }
    }
    @keyframes snowflakeCharge {
      0% { transform: scale(1) rotate(0deg); filter: drop-shadow(0 0 13px rgba(209,231,255,.6)); }
      100% { transform: scale(1.42) rotate(45deg); filter: drop-shadow(0 0 34px rgba(232,246,255,1)) brightness(1.45); }
    }
    @keyframes orbitBurst {
      0% { transform: scale(.88); opacity: 1; }
      100% { transform: scale(1.55); opacity: 0; }
    }
    @keyframes snowflakeBurst {
      0% { transform: scale(1.42) rotate(45deg); opacity: 1; }
      100% { transform: scale(2.15) rotate(115deg); opacity: 0; }
    }
    @keyframes iceShardBurst {
      0% { opacity: 0; transform: translate(-50%,-50%) scale(.08) rotate(0deg); }
      22% { opacity: .95; }
      100% { opacity: 0; transform: translate(-50%,-50%) scale(1.08) rotate(72deg); }
    }

    .snowflake-button svg { width: min(17vw, 145px); height: min(17vw, 145px); min-width: 108px; min-height: 108px; }
    .intro-copy {
      margin-top: 31px; text-align: center; color: #d9e4f5;
      font-size: clamp(19px, 4.5vw, 27px); font-weight: 350; letter-spacing: .16em;
      text-shadow: 0 0 16px rgba(188, 211, 249, .35);
      white-space: nowrap;
    }
    .touch-hint {
      margin-top: 42px; color: rgba(173, 190, 219, .66);
      letter-spacing: .7em; text-indent: .7em; font-size: 15px; font-weight: 600;
    }

    .bottom-actions {
      position: absolute; left: 0; right: 0; bottom: calc(26px + var(--safe-bottom));
      z-index: 10; display: flex; gap: 13px; padding: 0 6%;
    }
    .action {
      min-width: 0; flex: 1; height: clamp(66px, 13vw, 94px);
      border-radius: 999px; border: 3px solid rgba(244, 234, 249, .9);
      color: white; font-size: clamp(17px, 4.5vw, 25px); font-weight: 800;
      letter-spacing: .02em; text-shadow: 0 1px 2px rgba(0,0,0,.18);
      box-shadow: 0 8px 22px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.25);
      transition: transform .18s ease, filter .18s ease;
    }
    .action:active { transform: scale(.97); filter: brightness(1.1); }
    .action.custom { background: #4b365e; border-color: #e7dcec; }
    .action.generate { background: #2d91d7; border-color: #f5d9c4; }

    /* Reveal / final scene */
    .final-scene {
      position: absolute; inset: 0; z-index: 3; overflow: hidden;
      opacity: 0; visibility: hidden; pointer-events: none;
      background:
        radial-gradient(ellipse at 50% 47%, rgba(115, 139, 166, .68) 0%, rgba(53, 69, 91, .72) 39%, rgba(19, 29, 45, .96) 76%),
        linear-gradient(140deg, #a8bbce, #253246 52%, #0c1423);
      transition: opacity 1.1s ease, visibility 1.1s ease;
    }
    .final-scene::before {
      content: ""; position: absolute; inset: -10%;
      background:
        radial-gradient(ellipse at 49% 25%, rgba(217, 232, 248, .30), transparent 24%),
        radial-gradient(ellipse at 25% 62%, rgba(187, 210, 234, .22), transparent 26%),
        radial-gradient(ellipse at 76% 70%, rgba(174, 195, 220, .20), transparent 25%),
        linear-gradient(180deg, rgba(221,236,250,.18), rgba(8,14,26,.25));
      filter: blur(18px); transform: scale(1.08);
      animation: iceFogDrift 15s ease-in-out infinite alternate;
      z-index: 0;
    }
    @keyframes iceFogDrift {
      0% { transform: translate3d(-1.5%, -1%, 0) scale(1.06); filter: blur(18px); }
      100% { transform: translate3d(1.5%, 1.2%, 0) scale(1.14); filter: blur(24px); }
    }
    .final-scene::after {
      content: ""; position: absolute; z-index: 2; inset: -35% -70%;
      pointer-events: none; opacity: 0;
      background: linear-gradient(112deg, transparent 39%, rgba(232,244,255,.06) 46%, rgba(245,250,255,.22) 50%, rgba(220,237,255,.07) 54%, transparent 62%);
      transform: translateX(-38%) rotate(8deg);
      animation: iceLightSweep 9s ease-in-out 1.2s infinite;
    }
    @keyframes iceLightSweep {
      0%, 18% { opacity: 0; transform: translateX(-42%) rotate(8deg); }
      32% { opacity: .9; }
      58% { opacity: .55; transform: translateX(42%) rotate(8deg); }
      72%, 100% { opacity: 0; transform: translateX(48%) rotate(8deg); }
    }
    .blur-shadow {
      position: absolute; left: 50%; top: 50%; width: 58%; height: 70%;
      z-index: 1; transform: translate(-50%, -50%); opacity: .7; filter: blur(24px);
      background:
        radial-gradient(ellipse at 50% 24%, rgba(3,8,18,.86) 0 8%, transparent 9%),
        radial-gradient(ellipse at 48% 43%, rgba(3,8,18,.86) 0 21%, transparent 22%),
        radial-gradient(ellipse at 50% 73%, rgba(3,8,18,.90) 0 27%, transparent 28%);
      animation: shadowDrift 8s ease-in-out infinite alternate;
    }
    @keyframes shadowDrift { from { transform: translate(-50%,-50%) scale(.94); } to { transform: translate(-50%,-48%) scale(1.04); } }
    .frost-edge {
      position: absolute; inset: -2%; width: 104%; height: 104%; pointer-events: none;
      z-index: 3; opacity: .76; filter: drop-shadow(0 0 5px rgba(228,242,255,.45));
      transform-origin: center;
      animation: frostBreath 6s ease-in-out infinite alternate;
    }
    @keyframes frostBreath {
      0% { opacity: .58; filter: drop-shadow(0 0 3px rgba(228,242,255,.28)); }
      100% { opacity: .9; filter: drop-shadow(0 0 10px rgba(228,242,255,.68)); }
    }
    .frost-vignette {
      z-index: 4; position: absolute; inset: 0;
      animation: vignetteBreathe 8s ease-in-out infinite alternate;
      background: radial-gradient(ellipse at center, transparent 34%, rgba(7,13,24,.15) 70%, rgba(7,13,24,.56) 100%);
    }
    @keyframes vignetteBreathe {
      from { opacity: .82; }
      to { opacity: 1; }
    }
    .final-copy {
      position: absolute; z-index: 5; left: 0; right: 0; top: 49%;
      transform: translateY(-50%); text-align: center; padding: 0 5%;
      opacity: 0; transition: opacity 1.2s ease .25s, transform 1.2s ease .25s;
    }
    /* 第二幕文字按标题 → 中文祝福 → 英文短句依次显现 */
    .final-copy > div {
      opacity: 0;
      transform: translateY(24px);
      filter: blur(9px);
      will-change: opacity, transform, filter;
    }
    .is-final .final-title {
      animation: lineReveal .95s cubic-bezier(.2,.75,.25,1) .45s forwards;
    }
    .is-final .final-subtitle {
      animation: lineReveal .95s cubic-bezier(.2,.75,.25,1) 1.45s forwards;
    }
    .is-final .final-english {
      animation: lineReveal 1.05s cubic-bezier(.2,.75,.25,1) 2.45s forwards;
    }
    @keyframes lineReveal {
      0% { opacity: 0; transform: translateY(24px); filter: blur(9px); }
      65% { opacity: 1; filter: blur(0); }
      100% { opacity: 1; transform: translateY(0); filter: blur(0); }
    }
    .final-title {
      font-family: "Songti SC", "STSong", "Noto Serif CJK SC", "SimSun", serif;
      font-size: clamp(43px, 10.3vw, 76px); line-height: 1.28; font-weight: 500;
      letter-spacing: .10em; text-indent: .10em; white-space: nowrap;
      text-shadow: 0 0 20px rgba(240,247,255,.58), 0 2px 15px rgba(0,0,0,.3);
    }
    .final-subtitle {
      margin-top: 27px; font-size: clamp(17px, 4.4vw, 25px); font-weight: 350;
      letter-spacing: .18em; text-indent: .18em; color: rgba(244,248,255,.92);
      text-shadow: 0 1px 12px rgba(0,0,0,.32); white-space: nowrap;
    }
    .final-english {
      margin-top: 25px; font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(11px, 3vw, 17px); letter-spacing: .32em; text-indent: .32em;
      color: rgba(227,238,252,.72); white-space: nowrap;
    }
    .is-final .final-scene { opacity: 1; visibility: visible; pointer-events: auto; }
    .is-final .final-copy { opacity: 1; transform: translateY(-50%); }
    .is-final .intro-content { opacity: 0; transform: translateY(-4%) scale(.94); pointer-events: none; }
    .is-final #stars { opacity: .55; }
    #stars { transition: opacity 1s ease; }

    .frost-wash {
      position: absolute; inset: 50%; z-index: 5; border-radius: 50%;
      background: radial-gradient(circle, rgba(232,244,255,.92), rgba(182,211,239,.45) 32%, rgba(225,239,252,0) 70%);
      transform: translate(-50%,-50%) scale(0); opacity: 0; pointer-events: none;
    }
    .transitioning .frost-wash { animation: frostBloom 1.15s cubic-bezier(.16,.75,.24,1) forwards; }
    @keyframes frostBloom {
      0% { transform: translate(-50%,-50%) scale(0); opacity: .9; }
      70% { opacity: .72; }
      100% { transform: translate(-50%,-50%) scale(4.2); opacity: 0; }
    }

    /* Customization sheet */
    .modal-backdrop {
      position: absolute; inset: 0; z-index: 30; display: flex; align-items: flex-end;
      background: rgba(2,6,13,.62); opacity: 0; visibility: hidden;
      transition: opacity .25s ease, visibility .25s ease; backdrop-filter: blur(8px);
    }
    .modal-backdrop.open { opacity: 1; visibility: visible; }
    .sheet {
      width: 100%; max-height: 86%; overflow-y: auto; overscroll-behavior: contain;
      padding: 12px 22px calc(24px + var(--safe-bottom));
      border-radius: 25px 25px 0 0; color: #172338;
      background: linear-gradient(180deg, #f7faff, #e7eef8);
      transform: translateY(30px); transition: transform .3s ease;
    }
    .modal-backdrop.open .sheet { transform: translateY(0); }
    .sheet-handle { width: 42px; height: 4px; background: #b8c5d5; border-radius: 9px; margin: 0 auto 18px; }
    .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
    .sheet-head h2 { margin: 0; font-size: 21px; color: #172338; }
    .close-sheet { border: 0; background: #dce5f0; color: #40516b; width: 32px; height: 32px; border-radius: 50%; font-size: 20px; }
    .field { display: block; margin: 14px 0; }
    .field span { display: block; margin-bottom: 7px; color: #43536b; font-size: 13px; font-weight: 700; }
    .field input, .field textarea {
      width: 100%; border: 1px solid #c8d3e1; outline: none; border-radius: 12px;
      background: rgba(255,255,255,.85); padding: 12px 13px; color: #18263b;
      font-size: 15px; resize: vertical;
    }
    .field input:focus, .field textarea:focus { border-color: #6f9bc9; box-shadow: 0 0 0 3px rgba(111,155,201,.15); }
    .sheet-actions { display: flex; gap: 10px; margin-top: 18px; }
    .sheet-actions button { flex: 1; border: 0; border-radius: 12px; padding: 13px; font-weight: 750; }
    .cancel { background: #dce5f0; color: #34445c; }
    .apply { background: #2d91d7; color: white; }
    .toast {
      position: absolute; z-index: 40; left: 50%; bottom: calc(125px + var(--safe-bottom));
      transform: translate(-50%, 12px); opacity: 0; pointer-events: none;
      background: rgba(9,16,29,.82); color: #edf5ff; padding: 10px 15px;
      border: 1px solid rgba(216,232,255,.18); border-radius: 999px; font-size: 13px;
      white-space: nowrap; transition: opacity .25s ease, transform .25s ease;
      backdrop-filter: blur(8px);
    }
    .toast.show { opacity: 1; transform: translate(-50%,0); }

    @media (max-height: 700px) {
      .intro-content { transform: translateY(-5%); }
      .snow-orbit { width: 190px; height: 190px; min-width: 190px; min-height: 190px; }
      .snowflake-button svg { width: 105px; height: 105px; }
      .intro-copy { margin-top: 22px; font-size: 18px; }
      .touch-hint { margin-top: 25px; }
      .bottom-actions { bottom: calc(17px + var(--safe-bottom)); }
      .action { height: 64px; }
      .final-copy { top: 48%; }
    }
    @media (max-width: 360px) {
      .bottom-actions { padding: 0 4%; gap: 9px; }
      .action { font-size: 16px; border-width: 2px; }
      .intro-copy { font-size: 17px; letter-spacing: .1em; }
      .final-title { font-size: 39px; }
      .final-subtitle { font-size: 15px; letter-spacing: .12em; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
      .final-copy > div { opacity: 1; transform: none; filter: none; }
      .intro-content::after { display: none; }
      #frostGrowth { opacity: .72; }
    }
  </style>
</head>
<body>
  <main id="app" aria-label="冬将至，我与你">
    <div class="ambient-glow"></div>
    <canvas id="stars" aria-hidden="true"></canvas>
    <canvas id="snowfall" aria-hidden="true"></canvas>
    <canvas id="frostGrowth" aria-hidden="true"></canvas>

    <section class="intro-content" id="intro">
      <div class="snow-orbit">
        <button class="snowflake-button" id="openSnow" aria-label="轻触开启冬日祝福">
          <svg viewBox="0 0 120 120" fill="none" aria-hidden="true">
            <g stroke="currentColor" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M60 9V111M15.8 34.5L104.2 85.5M15.8 85.5L104.2 34.5"/>
              <path d="M60 9L51 20M60 9L69 20M60 31L48 24M60 31L72 24"/>
              <path d="M60 111L51 100M60 111L69 100M60 89L48 96M60 89L72 96"/>
              <path d="M15.8 34.5L30 35M15.8 34.5L20 48M35 45L35 32M35 45L47 40"/>
              <path d="M104.2 85.5L90 85M104.2 85.5L100 72M85 75L85 88M85 75L73 80"/>
              <path d="M15.8 85.5L30 85M15.8 85.5L20 72M35 75L35 88M35 75L47 80"/>
              <path d="M104.2 34.5L90 35M104.2 34.5L100 48M85 45L85 32M85 45L73 40"/>
            </g>
            <circle cx="60" cy="60" r="5" fill="currentColor"/>
          </svg>
        </button>
      </div>
      <div class="intro-copy">轻触窗户，看看冬天写给你的话</div>
      <div class="touch-hint">轻 触 开 启</div>
    </section>

    <section class="final-scene" id="finalScene" aria-hidden="true">
      <div class="blur-shadow"></div>
      <svg class="frost-edge" viewBox="0 0 400 850" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="iceLine" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#f6fbff" stop-opacity=".9"/>
            <stop offset="1" stop-color="#c9ddf0" stop-opacity=".18"/>
          </linearGradient>
          <filter id="soft"><feGaussianBlur stdDeviation="1.15"/></filter>
        </defs>
        <g fill="none" stroke="url(#iceLine)" stroke-width="1.05" stroke-linecap="round" opacity=".85" filter="url(#soft)">
          <path d="M-8 0L22 65L7 104L48 145L31 190L75 235L61 286L101 329"/>
          <path d="M22 65L58 43L81 9M22 65L-3 92M48 145L86 121L112 78M48 145L20 171"/>
          <path d="M7 104L-15 125M31 190L5 217M75 235L112 212L140 175"/>
          <path d="M408 0L378 65L393 104L352 145L369 190L325 235L339 286L299 329"/>
          <path d="M378 65L342 43L319 9M378 65L403 92M352 145L314 121L288 78M352 145L380 171"/>
          <path d="M393 104L415 125M369 190L395 217M325 235L288 212L260 175"/>
          <path d="M-10 850L24 790L8 748L48 707L31 662L75 615L60 570L102 526"/>
          <path d="M24 790L59 810L83 846M48 707L86 728L112 770M75 615L112 639L140 678"/>
          <path d="M410 850L376 790L392 748L352 707L369 662L325 615L340 570L298 526"/>
          <path d="M376 790L341 810L317 846M352 707L314 728L288 770M325 615L288 639L260 678"/>
        </g>
        <g stroke="#f3f9ff" stroke-width=".8" opacity=".7" fill="none">
          <path d="M30 20l-8 14m8-14l8 14m-8-14v25m-11-18l22 11m-22 0l22-11"/>
          <path d="M370 30l-8 14m8-14l8 14m-8-14v25m-11-18l22 11m-22 0l22-11"/>
          <path d="M18 810l-8 14m8-14l8 14m-8-14v25m-11-18l22 11m-22 0l22-11"/>
          <path d="M382 800l-8 14m8-14l8 14m-8-14v25m-11-18l22 11m-22 0l22-11"/>
        </g>
      </svg>
      <div class="frost-vignette"></div>
      <div class="final-copy">
        <div class="final-title" id="finalTitle">冬将至，我与你</div>
        <div class="final-subtitle" id="finalSubtitle">立冬已至 平安喜乐 祝你祝我祝我们</div>
        <div class="final-english" id="finalEnglish">WINTER IS COMING ·· YOU AND ME</div>
      </div>
    </section>

    <div class="frost-wash" id="frostWash"></div>

  </main>

  <script>
    (() => {
      const app = document.getElementById('app');
      const starCanvas = document.getElementById('stars');
      const snowCanvas = document.getElementById('snowfall');
      const frostCanvas = document.getElementById('frostGrowth');
      const starCtx = starCanvas.getContext('2d');
      const snowCtx = snowCanvas.getContext('2d');
      const frostCtx = frostCanvas.getContext('2d');

      let stars = [];
      let snowflakes = [];
      let isFinal = false;
      let revealStarted = false;
      let snowPhase = 'idle';
      let snowPhaseStart = 0;
      let frostBranches = [];
      let frostRevealAt = null;
      const pageStartedAt = performance.now();

      function resizeCanvases() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const width = app.clientWidth;
        const height = app.clientHeight;

        [starCanvas, snowCanvas, frostCanvas].forEach(canvas => {
          canvas.width = Math.floor(width * dpr);
          canvas.height = Math.floor(height * dpr);
          canvas.style.width = width + 'px';
          canvas.style.height = height + 'px';
          canvas.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
        });

        frostBranches = [];

        function addFrostBranch(x, y, angle, length, depth, delay, lineWidth, alpha) {
          const bend = (Math.random() - 0.5) * 0.12;
          const a = angle + bend;
          const x2 = x + Math.cos(a) * length;
          const y2 = y + Math.sin(a) * length;

          frostBranches.push({
            x1: x, y1: y, x2, y2, angle: a,
            depth, delay,
            duration: 0.045 + Math.random() * 0.035,
            lineWidth,
            alpha,
            sparkle: Math.random() > 0.64
          });

          if (depth <= 0) return;

          // Main vein continues inward; two smaller veins branch from its side.
          addFrostBranch(
            x2, y2, a + (Math.random() - 0.5) * 0.09,
            length * 0.79, depth - 1, delay + 0.105,
            lineWidth * 0.82, alpha * 0.94
          );

          if (depth >= 2) {
            const t = 0.52 + Math.random() * 0.12;
            const bx = x + (x2 - x) * t;
            const by = y + (y2 - y) * t;
            const side = 0.68 + Math.random() * 0.24;

            addFrostBranch(
              bx, by, a - side, length * (0.48 + Math.random() * 0.08),
              depth - 1, delay + 0.145, lineWidth * 0.62, alpha * 0.88
            );
            addFrostBranch(
              bx, by, a + side, length * (0.48 + Math.random() * 0.08),
              depth - 1, delay + 0.145, lineWidth * 0.62, alpha * 0.88
            );
          }
        }

        const unit = Math.min(width, height);
        const roots = [
          [0, 0, Math.PI / 4, 0.235, 4],
          [width, 0, 3 * Math.PI / 4, 0.235, 4],
          [0, height, -Math.PI / 4, 0.235, 4],
          [width, height, -3 * Math.PI / 4, 0.235, 4],
          [width * 0.27, -4, Math.PI / 2, 0.145, 3],
          [width * 0.73, -4, Math.PI / 2, 0.145, 3],
          [width * 0.27, height + 4, -Math.PI / 2, 0.145, 3],
          [width * 0.73, height + 4, -Math.PI / 2, 0.145, 3],
          [-4, height * 0.32, 0, 0.15, 3],
          [-4, height * 0.68, 0, 0.15, 3],
          [width + 4, height * 0.32, Math.PI, 0.15, 3],
          [width + 4, height * 0.68, Math.PI, 0.15, 3]
        ];

        roots.forEach(([x, y, angle, scale, depth]) => {
          addFrostBranch(
            x, y, angle, unit * scale, depth, Math.random() * 0.045,
            Math.max(0.65, unit * 0.0025), 0.82
          );
        });

        const starCount = Math.max(75, Math.floor(width * height / 7200));
        stars = Array.from({ length: starCount }, () => ({
          x: Math.random() * width,
          y: Math.random() * height,
          radius: Math.random() * 1.5 + 0.25,
          speed: Math.random() * 0.22 + 0.06,
          drift: (Math.random() - 0.5) * 0.16,
          alpha: Math.random() * 0.55 + 0.16,
          phase: Math.random() * Math.PI * 2
        }));

        // Three visual layers: tiny snow dust, medium flakes and detailed crystals.
        const count = Math.max(42, Math.min(76, Math.floor(width * height / 15500)));
        snowflakes = Array.from({ length: count }, (_, index) => {
          const crystal = index % 7 === 0;
          return {
            x: Math.random() * width,
            y: Math.random() * height,
            size: crystal ? Math.random() * 7 + 7 : Math.random() * 3.6 + 1.1,
            speed: crystal ? Math.random() * 0.45 + 0.38 : Math.random() * 0.8 + 0.22,
            drift: (Math.random() - 0.5) * 0.5,
            sway: Math.random() * 1.1 + 0.25,
            phase: Math.random() * Math.PI * 2,
            rotation: Math.random() * Math.PI,
            spin: (Math.random() - 0.5) * 0.012,
            alpha: crystal ? Math.random() * 0.34 + 0.42 : Math.random() * 0.42 + 0.2,
            crystal
          };
        });
      }

      function drawStars(time) {
        const width = app.clientWidth;
        const height = app.clientHeight;
        starCtx.clearRect(0, 0, width, height);

        stars.forEach(p => {
          p.y += p.speed;
          p.x += p.drift + Math.sin(time * 0.00045 + p.phase) * 0.08;
          if (p.y > height + 3) { p.y = -3; p.x = Math.random() * width; }
          if (p.x < -3) p.x = width + 3;
          if (p.x > width + 3) p.x = -3;

          const twinkle = 0.72 + Math.sin(time * 0.0015 + p.phase) * 0.24;
          starCtx.beginPath();
          starCtx.fillStyle = `rgba(224,237,255,${p.alpha * twinkle})`;
          starCtx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          starCtx.fill();
        });
      }

      function drawSnowCrystal(ctx, x, y, size, rotation, alpha) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rotation);
        ctx.strokeStyle = `rgba(244,249,255,${alpha})`;
        ctx.lineWidth = Math.max(0.85, size * 0.095);
        ctx.lineCap = 'round';
        ctx.shadowColor = 'rgba(218,237,255,0.95)';
        ctx.shadowBlur = size * 0.8;

        for (let arm = 0; arm < 6; arm++) {
          ctx.save();
          ctx.rotate(arm * Math.PI / 3);
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(0, -size);
          ctx.moveTo(0, -size * 0.48);
          ctx.lineTo(-size * 0.24, -size * 0.70);
          ctx.moveTo(0, -size * 0.48);
          ctx.lineTo(size * 0.24, -size * 0.70);
          ctx.stroke();
          ctx.restore();
        }
        ctx.restore();
      }

      function drawFrost(time) {
        const width = app.clientWidth;
        const height = app.clientHeight;
        frostCtx.clearRect(0, 0, width, height);

        // On the opening scene frost creeps in very slowly.
        // After the snowflake is touched, the ice veins spread across the edges.
        const introGrowth = Math.min(0.19, Math.max(0, (time - pageStartedAt - 1200) / 36000) * 0.19);
        const revealGrowth = frostRevealAt === null
          ? 0
          : 0.81 * Math.min(1, Math.max(0, (time - frostRevealAt) / 3600));
        const growth = Math.min(1, introGrowth + revealGrowth);

        if (growth <= 0.001) return;

        frostCtx.save();
        frostCtx.globalCompositeOperation = 'screen';

        // A translucent cold haze gathers at the four corners, without covering the copy.
        const radius = Math.min(width, height) * 0.43;
        const corners = [[0, 0], [width, 0], [0, height], [width, height]];
        corners.forEach(([x, y]) => {
          const haze = frostCtx.createRadialGradient(x, y, 0, x, y, radius);
          haze.addColorStop(0, `rgba(197,224,250,${0.075 * growth})`);
          haze.addColorStop(0.42, `rgba(174,209,242,${0.035 * growth})`);
          haze.addColorStop(1, 'rgba(174,209,242,0)');
          frostCtx.fillStyle = haze;
          frostCtx.fillRect(0, 0, width, height);
        });

        // Branches are drawn progressively, like real rime spreading along a window.
        frostBranches.forEach(branch => {
          const local = Math.max(0, Math.min(1, (growth - branch.delay) / branch.duration));
          if (local <= 0) return;

          const endX = branch.x1 + (branch.x2 - branch.x1) * local;
          const endY = branch.y1 + (branch.y2 - branch.y1) * local;
          const shimmer = 0.82 + Math.sin(time * 0.0018 + branch.delay * 19) * 0.16;
          const alpha = branch.alpha * shimmer * (0.34 + growth * 0.62);

          frostCtx.beginPath();
          frostCtx.moveTo(branch.x1, branch.y1);
          frostCtx.lineTo(endX, endY);
          frostCtx.lineCap = 'round';
          frostCtx.lineJoin = 'round';
          frostCtx.lineWidth = branch.lineWidth;
          frostCtx.strokeStyle = `rgba(193,222,249,${alpha * 0.55})`;
          frostCtx.shadowColor = 'rgba(184,222,255,0.9)';
          frostCtx.shadowBlur = 5.5 + growth * 5;
          frostCtx.stroke();

          // A fine, colder highlight gives each ice vein a glass-like edge.
          frostCtx.beginPath();
          frostCtx.moveTo(branch.x1, branch.y1);
          frostCtx.lineTo(endX, endY);
          frostCtx.lineWidth = Math.max(0.42, branch.lineWidth * 0.34);
          frostCtx.strokeStyle = `rgba(250,253,255,${alpha * 0.72})`;
          frostCtx.shadowBlur = 2.5;
          frostCtx.stroke();

          // Tiny crystalline glints appear at some branch tips as the frost settles.
          if (branch.sparkle && local > 0.96 && branch.depth <= 2) {
            const pulse = 0.48 + (Math.sin(time * 0.003 + branch.delay * 35) + 1) * 0.22;
            frostCtx.beginPath();
            frostCtx.arc(endX, endY, 1.05 + growth * 0.8, 0, Math.PI * 2);
            frostCtx.fillStyle = `rgba(245,251,255,${pulse * growth})`;
            frostCtx.shadowColor = 'rgba(205,233,255,0.95)';
            frostCtx.shadowBlur = 8;
            frostCtx.fill();
          }
        });

        // Fine ice dust catches the light around the growing frost.
        if (growth > 0.32) {
          const dustCount = Math.floor(18 + growth * 34);
          for (let i = 0; i < dustCount; i++) {
            const seed = i * 127.1;
            const x = (Math.sin(seed) * 0.5 + 0.5) * width;
            const y = (Math.cos(seed * 0.73) * 0.5 + 0.5) * height;
            const edgeDistance = Math.min(x, width - x, y, height - y);
            if (edgeDistance > Math.min(width, height) * 0.22) continue;
            const twinkle = 0.35 + (Math.sin(time * 0.002 + seed) + 1) * 0.22;
            frostCtx.fillStyle = `rgba(236,247,255,${twinkle * growth * 0.48})`;
            frostCtx.beginPath();
            frostCtx.arc(x, y, 0.55 + (i % 3) * 0.35, 0, Math.PI * 2);
            frostCtx.fill();
          }
        }

        frostCtx.restore();
      }

      function drawSnow(time) {
        const width = app.clientWidth;
        const height = app.clientHeight;
        const centerX = width / 2;
        const centerY = height / 2;
        snowCtx.clearRect(0, 0, width, height);

        let phaseProgress = 0;
        if (snowPhase === 'gather') {
          phaseProgress = Math.min(1, (time - snowPhaseStart) / 650);
        } else if (snowPhase === 'burst') {
          phaseProgress = Math.min(1, (time - snowPhaseStart) / 520);
        }

        snowflakes.forEach(flake => {
          let drawAlpha = flake.alpha;
          let drawSize = flake.size;

          if (snowPhase === 'gather') {
            const eased = phaseProgress * phaseProgress * (3 - 2 * phaseProgress);
            flake.x = flake.gatherFromX + (centerX - flake.gatherFromX) * eased;
            flake.y = flake.gatherFromY + (centerY - flake.gatherFromY) * eased;
            flake.rotation += flake.spin * 2.2;
            drawSize *= 1 + eased * 0.42;
            drawAlpha = Math.min(1, flake.alpha + eased * 0.34);
          } else if (snowPhase === 'burst') {
            const eased = 1 - Math.pow(1 - phaseProgress, 2);
            const maxRadius = Math.max(width, height) * 0.64;
            const radius = 8 + eased * maxRadius;
            flake.x = centerX + Math.cos(flake.burstAngle) * radius;
            flake.y = centerY + Math.sin(flake.burstAngle) * radius;
            flake.rotation += flake.spin * 5;
            drawSize *= 1 + phaseProgress * 0.72;
            drawAlpha = flake.alpha * (1 - phaseProgress);
          } else {
            const finalBoost = isFinal ? 1.16 : 1;
            flake.y += flake.speed * finalBoost;
            flake.x += flake.drift + Math.sin(time * 0.001 + flake.phase) * flake.sway * (isFinal ? 0.42 : 0.34);
            flake.rotation += flake.spin;

            if (flake.y > height + flake.size + 5) {
              flake.y = -flake.size - Math.random() * 35;
              flake.x = Math.random() * width;
            }
            if (flake.x < -flake.size - 5) flake.x = width + flake.size;
            if (flake.x > width + flake.size + 5) flake.x = -flake.size;
          }

          if (flake.crystal) {
            drawSnowCrystal(snowCtx, flake.x, flake.y, drawSize, flake.rotation, drawAlpha);
          } else {
            snowCtx.save();
            snowCtx.globalAlpha = Math.max(0, Math.min(0.92, drawAlpha * (isFinal ? 1.12 : 1)));
            snowCtx.fillStyle = '#f4f8ff';
            snowCtx.shadowColor = 'rgba(222,239,255,0.98)';
            snowCtx.shadowBlur = drawSize * 2.6;
            snowCtx.beginPath();
            snowCtx.arc(flake.x, flake.y, Math.max(0.7, drawSize * 0.38), 0, Math.PI * 2);
            snowCtx.fill();
            snowCtx.restore();
          }
        });

        if (snowPhase === 'burst' && phaseProgress >= 1) {
          snowPhase = 'idle';
          snowflakes.forEach(flake => {
            flake.x = Math.random() * width;
            flake.y = Math.random() * height;
          });
        }
      }
      function animate(time) {
        drawStars(time);
        drawSnow(time);
        drawFrost(time);
        requestAnimationFrame(animate);
      }

      function reveal() {
        if (isFinal || revealStarted) return;
        revealStarted = true;
        frostRevealAt = performance.now();

        const centerX = app.clientWidth / 2;
        const centerY = app.clientHeight / 2;
        snowflakes.forEach(flake => {
          flake.gatherFromX = flake.x;
          flake.gatherFromY = flake.y;
          flake.burstAngle = Math.atan2(flake.y - centerY, flake.x - centerX);
        });

        // 1) All visible snow gathers toward the glowing snowflake.
        app.classList.add('gathering');
        snowPhase = 'gather';
        snowPhaseStart = performance.now();

        // 2) The gathered snow bursts outward as ice crystals.
        window.setTimeout(() => {
          app.classList.remove('gathering');
          app.classList.add('bursting');
          snowPhase = 'burst';
          snowPhaseStart = performance.now();
        }, 650);

        // 3) The crystal burst gives way to the frost wipe and second scene.
        window.setTimeout(() => {
          app.classList.remove('bursting');
          app.classList.add('transitioning');
          document.getElementById('finalScene').setAttribute('aria-hidden', 'false');
        }, 1080);

        window.setTimeout(() => {
          isFinal = true;
          app.classList.add('is-final');
        }, 1260);

        window.setTimeout(() => app.classList.remove('transitioning'), 2450);
      }

      document.getElementById('openSnow').addEventListener('click', reveal);
      window.addEventListener('resize', resizeCanvases, { passive: true });
      resizeCanvases();
      requestAnimationFrame(animate);

      // Prevent unwanted page scrolling in the WeChat mobile webview.
      document.addEventListener('touchmove', event => event.preventDefault(), { passive: false });
    })();
  </script>
