<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#080d18" />
  <meta name="description" content="冬将至，我与你。一个关于冬日、雪花与祝福的互动 H5。" />
  <title>冬将至，我与你</title>
  <style>
    :root {
      --night: #080d18;
      --ice: #dce8f8;
      --muted: #aab8d0;
      --gold: #f2a13b;
      --purple: #4b365e;
      --blue: #2c91d8;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; width: 100%; min-height: 100%; background: var(--night); }
    body {
      color: #f5f8ff;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
                   "Microsoft YaHei", sans-serif;
      overflow: hidden;
      overscroll-behavior: none;
    }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    #app {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100svh;
      min-height: 560px;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(ellipse at 50% 48%, rgba(35, 49, 75, .74) 0%, rgba(15, 23, 39, .88) 48%, rgba(5, 8, 15, 1) 100%),
        #080d18;
    }
    #stars {
      position: absolute; inset: 0; width: 100%; height: 100%;
      z-index: -1; pointer-events: none;
    }
    .ambient-glow {
      position: absolute; inset: -15%;
      z-index: -2; pointer-events: none;
      background:
        radial-gradient(ellipse at 52% 48%, rgba(85, 112, 157, .19), transparent 43%),
        radial-gradient(ellipse at 15% 18%, rgba(79, 100, 139, .10), transparent 32%);
      animation: breathe 8s ease-in-out infinite alternate;
    }
    @keyframes breathe { from { transform: scale(.96); opacity: .6; } to { transform: scale(1.06); opacity: 1; } }

    .top-tools {
      position: absolute; top: max(22px, env(safe-area-inset-top)); left: 0; right: 0;
      z-index: 8; display: flex; align-items: center; justify-content: space-between;
      padding: 0 27px; pointer-events: none;
    }
    .trial {
      pointer-events: auto; border: 1.5px solid rgba(232, 148, 47, .82);
      color: #ffad45; background: rgba(10, 18, 32, .72);
      border-radius: 999px; padding: 11px 22px 10px;
      font-size: 17px; font-weight: 750; letter-spacing: 1px;
      box-shadow: 0 0 20px rgba(238, 148, 48, .06), inset 0 0 14px rgba(255,255,255,.025);
      backdrop-filter: blur(8px);
    }
    .music {
      pointer-events: auto; width: 54px; height: 54px; border-radius: 50%;
      border: 2px solid rgba(231, 239, 250, .68); color: #f4f8ff;
      background: rgba(9, 15, 27, .38); display: grid; place-items: center;
      font-size: 27px; line-height: 1; backdrop-filter: blur(8px);
      box-shadow: 0 0 18px rgba(211, 230, 255, .12);
      transition: transform .25s ease, background .25s ease;
    }
    .music:active { transform: scale(.92); }
    .music.playing { background: rgba(177, 207, 244, .2); animation: musicPulse 1.5s ease-in-out infinite; }
    @keyframes musicPulse { 50% { box-shadow: 0 0 26px rgba(207, 228, 255, .5); } }

    .intro-content {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 0 24px;
      transform: translateY(-1.5%);
      transition: opacity .7s ease, transform .9s cubic-bezier(.2,.8,.2,1);
    }
    .snow-orbit {
      width: min(34vw, 276px); height: min(34vw, 276px); min-width: 190px; min-height: 190px;
      border: 2px solid rgba(160, 185, 222, .20); border-radius: 50%;
      display: grid; place-items: center; position: relative;
      box-shadow: 0 0 46px rgba(163, 195, 242, .035), inset 0 0 34px rgba(150, 180, 225, .025);
      animation: orbitFloat 5s ease-in-out infinite;
    }
    .snow-orbit::before {
      content: ""; position: absolute; inset: 10%; border-radius: 50%;
      background: radial-gradient(circle, rgba(201, 222, 255, .10), transparent 68%);
      filter: blur(10px);
    }
    @keyframes orbitFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .snowflake-button {
      border: 0; background: transparent; color: #eaf4ff; padding: 18px;
      display: grid; place-items: center; position: relative; z-index: 1;
      filter: drop-shadow(0 0 13px rgba(209, 231, 255, .6));
      transition: transform .45s ease, filter .45s ease;
    }
    .snowflake-button:active { transform: scale(.88) rotate(15deg); }
    .snowflake-button svg { width: min(17vw, 145px); height: min(17vw, 145px); min-width: 108px; min-height: 108px; }
    .intro-copy {
      margin-top: 31px; text-align: center; color: #d9e4f5;
      font-size: clamp(19px, 4.5vw, 27px); font-weight: 350; letter-spacing: .16em;
      text-shadow: 0 0 16px rgba(188, 211, 249, .35);
      white-space: nowrap;
    }
    .touch-hint {
      margin-top: 42px; color: rgba(173, 190, 219, .66);
      letter-spacing: .7em; text-indent: .7em; font-size: 15px; font-weight: 600;
    }

    .bottom-actions {
      position: absolute; left: 0; right: 0; bottom: calc(26px + var(--safe-bottom));
      z-index: 10; display: flex; gap: 13px; padding: 0 6%;
    }
    .action {
      min-width: 0; flex: 1; height: clamp(66px, 13vw, 94px);
      border-radius: 999px; border: 3px solid rgba(244, 234, 249, .9);
      color: white; font-size: clamp(17px, 4.5vw, 25px); font-weight: 800;
      letter-spacing: .02em; text-shadow: 0 1px 2px rgba(0,0,0,.18);
      box-shadow: 0 8px 22px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.25);
      transition: transform .18s ease, filter .18s ease;
    }
    .action:active { transform: scale(.97); filter: brightness(1.1); }
    .action.custom { background: #4b365e; border-color: #e7dcec; }
    .action.generate { background: #2d91d7; border-color: #f5d9c4; }

    /* Reveal / final scene */
    .final-scene {
      position: absolute; inset: 0; z-index: 2; overflow: hidden;
      opacity: 0; visibility: hidden; pointer-events: none;
      background:
        radial-gradient(ellipse at 50% 47%, rgba(115, 139, 166, .68) 0%, rgba(53, 69, 91, .72) 39%, rgba(19, 29, 45, .96) 76%),
        linear-gradient(140deg, #a8bbce, #253246 52%, #0c1423);
      transition: opacity 1.1s ease, visibility 1.1s ease;
    }
    .final-scene::before {
      content: ""; position: absolute; inset: -10%;
      background:
        radial-gradient(ellipse at 49% 25%, rgba(217, 232, 248, .30), transparent 24%),
        radial-gradient(ellipse at 25% 62%, rgba(187, 210, 234, .22), transparent 26%),
        radial-gradient(ellipse at 76% 70%, rgba(174, 195, 220, .20), transparent 25%),
        linear-gradient(180deg, rgba(221,236,250,.18), rgba(8,14,26,.25));
      filter: blur(18px); transform: scale(1.08);
    }
    .blur-shadow {
      position: absolute; left: 50%; top: 50%; width: 58%; height: 70%;
      transform: translate(-50%, -50%); opacity: .7; filter: blur(24px);
      background:
        radial-gradient(ellipse at 50% 24%, rgba(3,8,18,.86) 0 8%, transparent 9%),
        radial-gradient(ellipse at 48% 43%, rgba(3,8,18,.86) 0 21%, transparent 22%),
        radial-gradient(ellipse at 50% 73%, rgba(3,8,18,.90) 0 27%, transparent 28%);
      animation: shadowDrift 8s ease-in-out infinite alternate;
    }
    @keyframes shadowDrift { from { transform: translate(-50%,-50%) scale(.94); } to { transform: translate(-50%,-48%) scale(1.04); } }
    .frost-edge {
      position: absolute; inset: -2%; width: 104%; height: 104%; pointer-events: none;
      opacity: .76; filter: drop-shadow(0 0 5px rgba(228,242,255,.45));
    }
    .frost-vignette {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at center, transparent 34%, rgba(7,13,24,.15) 70%, rgba(7,13,24,.56) 100%);
    }
    .final-copy {
      position: absolute; left: 0; right: 0; top: 49%;
      transform: translateY(-50%); text-align: center; padding: 0 5%;
      opacity: 0; transition: opacity 1.2s ease .3s, transform 1.2s ease .3s;
    }
    .final-title {
      font-family: "Songti SC", "STSong", "Noto Serif CJK SC", "SimSun", serif;
      font-size: clamp(43px, 10.3vw, 76px); line-height: 1.28; font-weight: 500;
      letter-spacing: .10em; text-indent: .10em; white-space: nowrap;
      text-shadow: 0 0 20px rgba(240,247,255,.58), 0 2px 15px rgba(0,0,0,.3);
    }
    .final-subtitle {
      margin-top: 27px; font-size: clamp(17px, 4.4vw, 25px); font-weight: 350;
      letter-spacing: .18em; text-indent: .18em; color: rgba(244,248,255,.92);
      text-shadow: 0 1px 12px rgba(0,0,0,.32); white-space: nowrap;
    }
    .final-english {
      margin-top: 25px; font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(11px, 3vw, 17px); letter-spacing: .32em; text-indent: .32em;
      color: rgba(227,238,252,.72); white-space: nowrap;
    }
    .is-final .final-scene { opacity: 1; visibility: visible; pointer-events: auto; }
    .is-final .final-copy { opacity: 1; transform: translateY(-50%); }
    .is-final .intro-content { opacity: 0; transform: translateY(-4%) scale(.94); pointer-events: none; }
    .is-final #stars { opacity: .55; }
    #stars { transition: opacity 1s ease; }

    .frost-wash {
      position: absolute; inset: 50%; z-index: 5; border-radius: 50%;
      background: radial-gradient(circle, rgba(232,244,255,.92), rgba(182,211,239,.45) 32%, rgba(225,239,252,0) 70%);
      transform: translate(-50%,-50%) scale(0); opacity: 0; pointer-events: none;
    }
    .transitioning .frost-wash { animation: frostBloom 1.15s cubic-bezier(.16,.75,.24,1) forwards; }
    @keyframes frostBloom {
      0% { transform: translate(-50%,-50%) scale(0); opacity: .9; }
      70% { opacity: .72; }
      100% { transform: translate(-50%,-50%) scale(4.2); opacity: 0; }
    }

    /* Customization sheet */
    .modal-backdrop {
      position: absolute; inset: 0; z-index: 30; display: flex; align-items: flex-end;
      background: rgba(2,6,13,.62); opacity: 0; visibility: hidden;
      transition: opacity .25s ease, visibility .25s ease; backdrop-filter: blur(8px);
    }
    .modal-backdrop.open { opacity: 1; visibility: visible; }
    .sheet {
      width: 100%; max-height: 86%; overflow-y: auto; overscroll-behavior: contain;
      padding: 12px 22px calc(24px + var(--safe-bottom));
      border-radius: 25px 25px 0 0; color: #172338;
      background: linear-gradient(180deg, #f7faff, #e7eef8);
      transform: translateY(30px); transition: transform .3s ease;
    }
    .modal-backdrop.open .sheet { transform: translateY(0); }
    .sheet-handle { width: 42px; height: 4px; background: #b8c5d5; border-radius: 9px; margin: 0 auto 18px; }
    .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
    .sheet-head h2 { margin: 0; font-size: 21px; color: #172338; }
    .close-sheet { border: 0; background: #dce5f0; color: #40516b; width: 32px; height: 32px; border-radius: 50%; font-size: 20px; }
    .field { display: block; margin: 14px 0; }
    .field span { display: block; margin-bottom: 7px; color: #43536b; font-size: 13px; font-weight: 700; }
    .field input, .field textarea {
      width: 100%; border: 1px solid #c8d3e1; outline: none; border-radius: 12px;
      background: rgba(255,255,255,.85); padding: 12px 13px; color: #18263b;
      font-size: 15px; resize: vertical;
    }
    .field input:focus, .field textarea:focus { border-color: #6f9bc9; box-shadow: 0 0 0 3px rgba(111,155,201,.15); }
    .sheet-actions { display: flex; gap: 10px; margin-top: 18px; }
    .sheet-actions button { flex: 1; border: 0; border-radius: 12px; padding: 13px; font-weight: 750; }
    .cancel { background: #dce5f0; color: #34445c; }
    .apply { background: #2d91d7; color: white; }
    .toast {
      position: absolute; z-index: 40; left: 50%; bottom: calc(125px + var(--safe-bottom));
      transform: translate(-50%, 12px); opacity: 0; pointer-events: none;
      background: rgba(9,16,29,.82); color: #edf5ff; padding: 10px 15px;
      border: 1px solid rgba(216,232,255,.18); border-radius: 999px; font-size: 13px;
      white-space: nowrap; transition: opacity .25s ease, transform .25s ease;
      backdrop-filter: blur(8px);
    }
    .toast.show { opacity: 1; transform: translate(-50%,0); }

    @media (max-height: 700px) {
      .intro-content { transform: translateY(-5%); }
      .snow-orbit { width: 190px; height: 190px; min-width: 190px; min-height: 190px; }
      .snowflake-button svg { width: 105px; height: 105px; }
      .intro-copy { margin-top: 22px; font-size: 18px; }
      .touch-hint { margin-top: 25px; }
      .bottom-actions { bottom: calc(17px + var(--safe-bottom)); }
      .action { height: 64px; }
      .final-copy { top: 48%; }
    }
    @media (max-width: 360px) {
      .bottom-actions { padding: 0 4%; gap: 9px; }
      .action { font-size: 16px; border-width: 2px; }
      .intro-copy { font-size: 17px; letter-spacing: .1em; }
      .final-title { font-size: 39px; }
      .final-subtitle { font-size: 15px; letter-spacing: .12em; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main id="app" aria-label="冬将至，我与你">
    <div class="ambient-glow"></div>
    <canvas id="stars" aria-hidden="true"></canvas>

    <div class="top-tools">
      <div class="trial" id="trial">试玩 12 秒</div>
      <button class="music" id="musicBtn" aria-label="背景音乐开关" title="背景音乐">♫</button>
    </div>

    <section class="intro-content" id="intro">
      <div class="snow-orbit">
        <button class="snowflake-button" id="openSnow" aria-label="轻触开启冬日祝福">
          <svg viewBox="0 0 120 120" fill="none" aria-hidden="true">
            <g stroke="currentColor" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M60 9V111M15.8 34.5L104.2 85.5M15.8 85.5L104.2 34.5"/>
              <path d="M60 9L51 20M60 9L69 20M60 31L48 24M60 31L72 24"/>
              <path d="M60 111L51 100M60 111L69 100M60 89L48 96M60 89L72 96"/>
              <path d="M15.8 34.5L30 35M15.8 34.5L20 48M35 45L35 32M35 45L47 40"/>
              <path d="M104.2 85.5L90 85M104.2 85.5L100 72M85 75L85 88M85 75L73 80"/>
              <path d="M15.8 85.5L30 85M15.8 85.5L20 72M35 75L35 88M35 75L47 80"/>
              <path d="M104.2 34.5L90 35M104.2 34.5L100 48M85 45L85 32M85 45L73 40"/>
            </g>
            <circle cx="60" cy="60" r="5" fill="currentColor"/>
          </svg>
        </button>
      </div>
      <div class="intro-copy">轻触窗户，看看冬天写给你的话</div>
      <div class="touch-hint">轻 触 开 启</div>
    </section>

    <section class="final-scene" id="finalScene" aria-hidden="true">
      <div class="blur-shadow"></div>
      <svg class="frost-edge" viewBox="0 0 400 850" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="iceLine" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#f6fbff" stop-opacity=".9"/>
            <stop offset="1" stop-color="#c9ddf0" stop-opacity=".18"/>
          </linearGradient>
          <filter id="soft"><feGaussianBlur stdDeviation="1.15"/></filter>
        </defs>
        <g fill="none" stroke="url(#iceLine)" stroke-width="1.05" stroke-linecap="round" opacity=".85" filter="url(#soft)">
          <path d="M-8 0L22 65L7 104L48 145L31 190L75 235L61 286L101 329"/>
          <path d="M22 65L58 43L81 9M22 65L-3 92M48 145L86 121L112 78M48 145L20 171"/>
          <path d="M7 104L-15 125M31 190L5 217M75 235L112 212L140 175"/>
          <path d="M408 0L378 65L393 104L352 145L369 190L325 235L339 286L299 329"/>
          <path d="M378 65L342 43L319 9M378 65L403 92M352 145L314 121L288 78M352 145L380 171"/>
          <path d="M393 104L415 125M369 190L395 217M325 235L288 212L260 175"/>
          <path d="M-10 850L24 790L8 748L48 707L31 662L75 615L60 570L102 526"/>
          <path d="M24 790L59 810L83 846M48 707L86 728L112 770M75 615L112 639L140 678"/>
          <path d="M410 850L376 790L392 748L352 707L369 662L325 615L340 570L298 526"/>
          <path d="M376 790L341 810L317 846M352 707L314 728L288 770M325 615L288 639L260 678"/>
        </g>
        <g stroke="#f3f9ff" stroke-width=".8" opacity=".7" fill="none">
          <path d="M30 20l-8 14m8-14l8 14m-8-14v25m-11-18l22 11m-22 0l22-11"/>
          <path d="M370 30l-8 14m8-14l8 14m-8-14v25m-11-18l22 11m-22 0l22-11"/>
          <path d="M18 810l-8 14m8-14l8 14m-8-14v25m-11-18l22 11m-22 0l22-11"/>
          <path d="M382 800l-8 14m8-14l8 14m-8-14v25m-11-18l22 11m-22 0l22-11"/>
        </g>
      </svg>
      <div class="frost-vignette"></div>
      <div class="final-copy">
        <div class="final-title" id="finalTitle">冬将至，我与你</div>
        <div class="final-subtitle" id="finalSubtitle">立冬已至 平安喜乐 祝你祝我祝我们</div>
        <div class="final-english" id="finalEnglish">WINTER IS COMING ·· YOU AND ME</div>
      </div>
    </section>

    <div class="frost-wash" id="frostWash"></div>

    <div class="bottom-actions">
      <button class="action custom" id="customBtn">✎ 定制内容</button>
      <button class="action generate" id="generateBtn">🚀 直接生成</button>
    </div>

    <div class="modal-backdrop" id="modal">
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
        <div class="sheet-handle"></div>
        <div class="sheet-head">
          <h2 id="sheetTitle">定制你的冬日祝福</h2>
          <button class="close-sheet" id="closeModal" aria-label="关闭">×</button>
        </div>
        <label class="field">
          <span>主标题</span>
          <input id="inputTitle" maxlength="24" value="冬将至，我与你" placeholder="例如：冬将至，愿你安暖" />
        </label>
        <label class="field">
          <span>中文祝福</span>
          <textarea id="inputSubtitle" rows="2" maxlength="48" placeholder="写下一句冬日祝福">立冬已至 平安喜乐 祝你祝我祝我们</textarea>
        </label>
        <label class="field">
          <span>英文副标题</span>
          <input id="inputEnglish" maxlength="52" value="WINTER IS COMING ·· YOU AND ME" placeholder="A little warmth in winter" />
        </label>
        <div class="sheet-actions">
          <button class="cancel" id="cancelModal">取消</button>
          <button class="apply" id="applyCustom">保存并展示</button>
        </div>
      </div>
    </div>
    <div class="toast" id="toast" role="status"></div>

    <audio id="bgAudio" src="assets/winter.mp3" loop preload="none"></audio>
  </main>

  <script>
    (() => {
      const app = document.getElementById('app');
      const canvas = document.getElementById('stars');
      const ctx = canvas.getContext('2d');
      const trial = document.getElementById('trial');
      const modal = document.getElementById('modal');
      const audio = document.getElementById('bgAudio');
      const musicBtn = document.getElementById('musicBtn');
      const toast = document.getElementById('toast');
      let isFinal = false;
      let toastTimer = null;
      let particles = [];
      let raf = null;

      function resizeCanvas() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const rect = app.getBoundingClientRect();
        canvas.width = Math.floor(rect.width * dpr);
        canvas.height = Math.floor(rect.height * dpr);
        canvas.style.width = rect.width + 'px';
        canvas.style.height = rect.height + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const count = Math.max(75, Math.floor(rect.width * rect.height / 7200));
        particles = Array.from({ length: count }, () => ({
          x: Math.random() * rect.width,
          y: Math.random() * rect.height,
          r: Math.random() * 1.65 + .35,
          speed: Math.random() * .42 + .12,
          drift: (Math.random() - .5) * .22,
          alpha: Math.random() * .65 + .18,
          phase: Math.random() * Math.PI * 2
        }));
      }
      function drawStars(t) {
        const w = app.clientWidth, h = app.clientHeight;
        ctx.clearRect(0, 0, w, h);
        for (const p of particles) {
          p.y += p.speed;
          p.x += p.drift + Math.sin(t * .0005 + p.phase) * .12;
          if (p.y > h + 3) { p.y = -3; p.x = Math.random() * w; }
          if (p.x < -3) p.x = w + 3;
          if (p.x > w + 3) p.x = -3;
          const twinkle = .72 + Math.sin(t * .0015 + p.phase) * .24;
          ctx.beginPath();
          ctx.fillStyle = `rgba(224,237,255,${p.alpha * twinkle})`;
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
        }
        // A few tiny snowflake glyphs add depth to the night sky.
        ctx.font = '15px serif';
        ctx.fillStyle = 'rgba(232,241,255,.55)';
        const marks = [[.47,.39],[.69,.36],[.86,.57],[.22,.82],[.79,.86]];
        marks.forEach((m, i) => {
          const x = m[0] * w + Math.sin(t * .00035 + i) * 5;
          const y = m[1] * h + Math.cos(t * .0004 + i) * 7;
          ctx.fillText('❄', x, y);
        });
        raf = requestAnimationFrame(drawStars);
      }
      resizeCanvas();
      raf = requestAnimationFrame(drawStars);
      window.addEventListener('resize', resizeCanvas, { passive: true });

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 2300);
      }
      function reveal() {
        if (isFinal) return;
        isFinal = true;
        app.classList.add('transitioning');
        document.getElementById('finalScene').setAttribute('aria-hidden', 'false');
        setTimeout(() => {
          app.classList.add('is-final');
        }, 180);
        setTimeout(() => {
          app.classList.remove('transitioning');
        }, 1300);
      }
      document.getElementById('openSnow').addEventListener('click', reveal);
      document.getElementById('generateBtn').addEventListener('click', reveal);

      function openModal() {
        document.getElementById('inputTitle').value = document.getElementById('finalTitle').textContent;
        document.getElementById('inputSubtitle').value = document.getElementById('finalSubtitle').textContent;
        document.getElementById('inputEnglish').value = document.getElementById('finalEnglish').textContent;
        modal.classList.add('open');
      }
      function closeModal() { modal.classList.remove('open'); }
      document.getElementById('customBtn').addEventListener('click', openModal);
      document.getElementById('closeModal').addEventListener('click', closeModal);
      document.getElementById('cancelModal').addEventListener('click', closeModal);
      modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
      document.getElementById('applyCustom').addEventListener('click', () => {
        const title = document.getElementById('inputTitle').value.trim();
        const subtitle = document.getElementById('inputSubtitle').value.trim();
        const english = document.getElementById('inputEnglish').value.trim();
        document.getElementById('finalTitle').textContent = title || '冬将至，我与你';
        document.getElementById('finalSubtitle').textContent = subtitle || '立冬已至 平安喜乐 祝你祝我祝我们';
        document.getElementById('finalEnglish').textContent = english || 'WINTER IS COMING ·· YOU AND ME';
        closeModal();
        reveal();
      });

      musicBtn.addEventListener('click', async () => {
        if (audio.paused) {
          try {
            await audio.play();
            musicBtn.classList.add('playing');
            musicBtn.textContent = '♫';
            showToast('背景音乐已开启');
          } catch (e) {
            showToast('添加 assets/winter.mp3 后即可播放背景音乐');
          }
        } else {
          audio.pause();
          musicBtn.classList.remove('playing');
          showToast('背景音乐已关闭');
        }
      });
      audio.addEventListener('ended', () => musicBtn.classList.remove('playing'));
      audio.addEventListener('error', () => {
        if (!audio.paused) showToast('暂未找到音乐文件，请添加 assets/winter.mp3');
        musicBtn.classList.remove('playing');
      });

      // The badge mirrors the short trial countdown shown in the reference.
      let seconds = 12;
      trial.textContent = `试玩 ${seconds} 秒`;
      const countdown = setInterval(() => {
        if (seconds > 0) seconds -= 1;
        trial.textContent = seconds > 0 ? `试玩 ${seconds} 秒` : '体验预览';
        if (seconds <= 0) clearInterval(countdown);
      }, 1000);

      // Avoid accidental page scrolling inside the WeChat webview.
      document.addEventListener('touchmove', e => {
        if (!modal.classList.contains('open')) e.preventDefault();
      }, { passive: false });
    })();
  </script>
</body>
</html>
